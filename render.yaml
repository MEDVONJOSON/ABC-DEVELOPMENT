services:
  - type: web
    name: abc-development-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: abc-development-data
      mountPath: /var/data
      sizeGB: 1

